<main>
  <div class="comments-container">
    <div class="comments-window">
      @for (comment of comments; track comment.id) {
      <app-comment [comment]="comment"></app-comment>
      }
    </div>
    <div class="user-comment">
      <img [src]="currentUser?.image?.png" />
    </div>
  </div>
</main>
